      apiKey: "YOUR_API_KEY",

      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

      const saved = localStorage.getItem('dualdrive_admin_config');
      if (saved) {
        try { return JSON.parse(saved); } catch (e) { }

      return {
        firebase: DEFAULT_FIREBASE_CONFIG,
        cloudinaryCloudName: "YOUR_CLOUD_NAME",
        cloudinaryUploadPreset: "YOUR_UPLOAD_PRESET"
      };
    };

    let fbApp, fbAuth, fbDB;
    const initFirebaseInstance = (config) => {
      if (config.apiKey && config.apiKey !== "YOUR_API_KEY") {
        try {
          if (firebase.apps.length > 0) {
            firebase.apps.forEach(app => app.delete());
          }
          fbApp = firebase.initializeApp(config);
          fbAuth = firebase.auth();
          fbDB = firebase.firestore();
          return true;
        } catch (err) {
          console.error("Firebase init error:", err);
        }
      }
      return false;
    };

    const isFirebaseConfigured = initFirebaseInstance(initialConfig.firebase);

            ? 'bg-red-950/95 text-red-300 border-red-800' 
            : 'bg-emerald-950/95 text-emerald-300 border-emerald-800'

    // --- APPLICATION ROOT COMPONENT ---
    function App() {
      const [config, setConfig] = useState(getSavedConfig);
      const [firebaseReady, setFirebaseReady] = useState(isFirebaseConfigured);
      const [user, setUser] = useState(null);
      const [loadingUser, setLoadingUser] = useState(true);
      const [toasts, setToasts] = useState([]);

      const addToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
      };

      const removeToast = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      };

      // Set up authentication observer
      useEffect(() => {
        if (firebaseReady && fbAuth) {
          const unsubscribe = fbAuth.onAuthStateChanged(usr => {
            setUser(usr);
            setLoadingUser(false);
          });
          return unsubscribe;
        } else {
          setLoadingUser(false);
        }
      }, [firebaseReady]);

      // Re-initialize Firebase if credentials change
      const updateSystemConfig = (newConfig) => {
        localStorage.setItem('dualdrive_admin_config', JSON.stringify(newConfig));
        setConfig(newConfig);
        const initiated = initFirebaseInstance(newConfig.firebase);
        setFirebaseReady(initiated);
        if (initiated) {
          addToast("Firebase configuration applied successfully!", "success");
        } else {
          addToast("Failed to initialize Firebase with those credentials. Please check details.", "error");
        }
      };

      // Log actions to Firestore
      const logAction = async (actionText) => {
        if (!firebaseReady || !fbDB || !user) return;
        try {
          await fbDB.collection('adminLogs').add({
            action: actionText,
            adminEmail: user.email,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) {
          console.error("Failed to log activity:", e);
        }
      };

      return (
        <AppContext.Provider value={{ config, updateSystemConfig, firebaseReady, user, setUser, addToast, logAction }}>
          <HashRouter>
            <div className="min-h-screen bg-asphalt flex flex-col justify-between">
              <Routes>
                <Route path="/admin/login" element={<LoginView />} />
                <Route path="/admin/dashboard/*" element={
                  <ProtectedRoute loadingUser={loadingUser}>
                    <DashboardLayout />
                  </ProtectedRoute>
                } />
                <Route path="*" element={<Navigate to={user ? "/admin/dashboard" : "/admin/login"} replace />} />
              </Routes>
              {toasts.map(t => (
                <Toast key={t.id} message={t.message} type={t.type} onClose={() => removeToast(t.id)} />
              ))}
            </div>
          </HashRouter>
        </AppContext.Provider>
      );
    }

    // --- PROTECTED ROUTE FILTER ---
    function ProtectedRoute({ children, loadingUser }) {
      const { user, firebaseReady } = useContext(AppContext);

      if (loadingUser) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-asphalt">
            <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-orangeAccent mb-4"></div>
            <p className="text-zinc-500 text-sm font-mono tracking-widest">VALIDATING USER IDENTITY...</p>
          </div>
        );
      }

      if (!firebaseReady) {
        return <Navigate to="/admin/login" replace />;
      }

      if (!user) {
        return <Navigate to="/admin/login" replace />;
      }

      return children;
    }

    // --- CLOUDINARY UPLOADER HELPER ---
    const CloudinaryUpload = ({ currentUrl, onUploadComplete, label }) => {
      const { config, addToast } = useContext(AppContext);
      const [uploading, setUploading] = useState(false);

      const handleFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (config.cloudinaryCloudName === "YOUR_CLOUD_NAME" || config.cloudinaryUploadPreset === "YOUR_UPLOAD_PRESET") {
          addToast("Cloudinary credentials are not configured! Please configure in settings first.", "error");
          return;
        }

        setUploading(true);
        try {
          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", config.cloudinaryUploadPreset);

          const res = await fetch(`https://api.cloudinary.com/v1_1/${config.cloudinaryCloudName}/image/upload`, {
            method: "POST",
            body: formData
          });

          if (!res.ok) throw new Error("Upload request rejected");
          const data = await res.json();
          onUploadComplete(data.secure_url);
          addToast("Image uploaded successfully!", "success");
        } catch (err) {
          console.error(err);
          addToast("Failed to upload image. Verify Cloudinary preset & cloud credentials.", "error");
        } finally {
          setUploading(false);
        }
      };

      return (
        <div className="space-y-2">
          <label className="block text-xs font-bold uppercase tracking-wider text-zinc-400">{label}</label>
          <div className="flex flex-col sm:flex-row items-center gap-4 bg-zinc-900 border border-zinc-800 p-3.5 rounded-xl">
            {currentUrl ? (
              <div className="relative group w-20 h-20 rounded-lg overflow-hidden bg-zinc-950 border border-zinc-800 shrink-0">
                <img src={currentUrl} className="w-full h-full object-cover" alt="Preview" />
                <button 
                  type="button" 
                  onClick={() => onUploadComplete("")}
                  className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white transition-opacity"
                >
                  <i className="fa-solid fa-trash text-sm"></i>
                </button>
              </div>
            ) : (
              <div className="w-20 h-20 rounded-lg border-2 border-dashed border-zinc-800 flex items-center justify-center text-zinc-600 shrink-0">
                <i className="fa-solid fa-image text-xl"></i>
              </div>
            )}
            
            <div className="flex-1 w-full">
              <label className="relative flex items-center justify-center gap-2.5 px-4 py-2.5 rounded-lg border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold text-white tracking-wide cursor-pointer transition-colors min-h-[44px] text-center">
                {uploading ? (
                  <>
                    <i className="fa-solid fa-spinner animate-spin"></i>
                    <span>Uploading to Cloudinary...</span>
                  </>
                ) : (
                  <>
                    <i className="fa-solid fa-cloud-arrow-up"></i>
                    <span>Select File & Upload</span>
                  </>
                )}
                <input type="file" onChange={handleFileChange} accept="image/*" disabled={uploading} className="hidden" />
              </label>
              <p className="text-[10px] text-zinc-500 mt-1.5 text-center sm:text-left">Supports PNG, JPG, JPEG under 10MB</p>
            </div>
          </div>
        </div>
      );
    };

    // --- SECURED SIGN-IN VIEW ---
    function LoginView() {
      const { user, firebaseReady, addToast } = useContext(AppContext);
      const navigate = useNavigate();

      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (user) navigate('/admin/dashboard');
      }, [user]);

          if (!doc.exists) {
            // Seed home
            await homeRef.set({ ...SEED_DATA.homeContent, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            
            // Seed driving
            await fbDB.collection('drivingContent').doc('main').set({ ...SEED_DATA.drivingContent, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            
            // Seed real estate
            await fbDB.collection('realEstateContent').doc('main').set({ ...SEED_DATA.realEstateContent, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            
            await logAction("Database environment bootstrapped with premium seed templates.");

    // --- SUB-VIEW: DRIVING ACADEMY CONTENT MANAGER ---
    function DrivingManagerView() {
      const { fbDB, firebaseReady, addToast, logAction } = useContext(AppContext);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [data, setData] = useState(null);

      // Dialog deletion prompts
      const [deleteModal, setDeleteModal] = useState({ show: false, listName: '', index: -1 });

      // Item modals state (For Add/Edit of Plans, Instructors, Testimonials)
      const [planModal, setPlanModal] = useState({ show: false, index: -1, payload: { id: '', name: '', price: 0, features: '', buttonText: '' } });
      const [instModal, setInstModal] = useState({ show: false, index: -1, payload: { id: '', name: '', experience: '', specialty: '', avatarUrl: '', rating: 5 } });
      const [testiModal, setTestiModal] = useState({ show: false, index: -1, payload: { id: '', studentName: '', reviewText: '', rating: 5, date: '' } });

      useEffect(() => {
        if (!firebaseReady || !fbDB) return;
        const fetchDriving = async () => {
          try {
            const snap = await fbDB.collection('drivingContent').doc('main').get();
            if (snap.exists) setData(snap.data());
          } catch (e) {
            console.error(e);
            addToast("Failed to fetch driving contents", "error");
          } finally {
            setLoading(false);
          }
        };
        fetchDriving();
      }, [firebaseReady]);

      const handleSave = async () => {
        setSaving(true);
        try {
          const payload = { ...data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
          await fbDB.collection('drivingContent').doc('main').set(payload);
          await logAction("Updated Driving Academy curriculum, rate listings, or testimonials.");
          addToast("Driving academy metrics synced dynamically!", "success");
        } catch (err) {
          addToast(err.message, "error");
        } finally {
          setSaving(false);
        }
      };

      // CRUD - Plans
      const savePlanItem = (e) => {
        e.preventDefault();
        const nextPlans = [...(data.pricingPlans || [])];
        const featuresArray = planModal.payload.features.split('\n').filter(Boolean);
        const item = { ...planModal.payload, features: featuresArray, price: Number(planModal.payload.price) };

        if (planModal.index === -1) {
          item.id = 'pkg-' + Date.now();
          nextPlans.push(item);
        } else {
          nextPlans[planModal.index] = item;
        }

        setData({ ...data, pricingPlans: nextPlans });
        setPlanModal({ show: false, index: -1, payload: { id: '', name: '', price: 0, features: '', buttonText: '' } });
      };

      // CRUD - Instructors
      const saveInstructorItem = (e) => {
        e.preventDefault();
        const nextList = [...(data.instructors || [])];
        const item = { ...instModal.payload, rating: Number(instModal.payload.rating) };

        if (instModal.index === -1) {
          item.id = 'inst-' + Date.now();

        } else {

        e.preventDefault();

          item.id = 'test-' + Date.now();

          nextList[testiModal.index] = item;
        }

        setData({ ...data, testimonials: nextList });

      };

      // Delete triggers

        const listName = deleteModal.listName;
        const index = deleteModal.index;
        const nextList = [...data[listName]];
        nextList.splice(index, 1);

                    <button type="submit" className="px-5 py-2 bg-[#ff6b35] text-white font-extrabold rounded-lg hover:bg-[#e05621]">Save Item</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* GENERIC CONFIRM DELETION DIALOG */}
          {deleteModal.show && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-red-950/40 text-red-400 mx-auto flex items-center justify-center text-lg">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h4 className="font-heading font-bold text-white text-md">Confirm element removal</h4>
                <p className="text-xs text-zinc-500 leading-relaxed">Are you sure you want to delete this element? This action will remove the item from local lists permanently.</p>
                <div className="flex justify-center gap-3 pt-2">
                  <button onClick={() => setDeleteModal({ show: false, listName: '', index: -1 })} className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-lg text-xs">Keep Item</button>
                  <button onClick={confirmDeleteElement} className="px-5 py-2 bg-red-650 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-lg text-xs">Confirm Delete</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- SUB-VIEW: REAL ESTATE MANAGER ---
    function RealEstateManagerView() {
      const { fbDB, firebaseReady, addToast, logAction } = useContext(AppContext);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [data, setData] = useState(null);

      const [deleteModal, setDeleteModal] = useState({ show: false, index: -1 });
      const [propertyModal, setPropertyModal] = useState({ show: false, index: -1, payload: { id: '', title: '', price: 0, bedrooms: 2, bathrooms: 2, area: 1200, imageUrl: '', description: '', featured: false } });

      useEffect(() => {
        if (!firebaseReady || !fbDB) return;
        const fetchProperties = async () => {
          try {
            const snap = await fbDB.collection('realEstateContent').doc('main').get();
            if (snap.exists) setData(snap.data());
          } catch (e) {
            console.error(e);
            addToast("Failed to fetch real estate listings", "error");
          } finally {
            setLoading(false);
          }
        };
        fetchProperties();
      }, [firebaseReady]);

      const handleSave = async () => {
        setSaving(true);
        try {
          const payload = { ...data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
          await fbDB.collection('realEstateContent').doc('main').set(payload);
          await logAction("Updated Real Estate property selections, interest scales, or help directives.");
          addToast("Properties portfolio catalog synced live!", "success");
        } catch (err) {
          addToast(err.message, "error");
        } finally {
          setSaving(false);
        }
      };

      // CRUD - Save property
      const savePropertyItem = (e) => {
        e.preventDefault();
        const nextProps = [...(data.properties || [])];
        const item = { 
          ...propertyModal.payload, 
          price: Number(propertyModal.payload.price), 
          bedrooms: Number(propertyModal.payload.bedrooms), 
          bathrooms: Number(propertyModal.payload.bathrooms), 
          area: Number(propertyModal.payload.area) 
        };

        if (propertyModal.index === -1) {
          item.id = 'prop-' + Date.now();
          nextProps.push(item);
        } else {
          nextProps[propertyModal.index] = item;
        }

        setData({ ...data, properties: nextProps });
        setPropertyModal({ show: false, index: -1, payload: {} });
      };

      // CRUD - Delete property
      const confirmDelete = () => {
        const nextList = [...data.properties];
        nextList.splice(deleteModal.index, 1);
        setData({ ...data, properties: nextList });
        setDeleteModal({ show: false, index: -1 });
        addToast("Listing removed from pending updates list.", "success");
      };

      if (loading) return <div className="text-zinc-500 animate-pulse font-mono flex items-center justify-center p-20 py-40 gap-3"><i className="fa-solid fa-spinner animate-spin"></i>FETCHING METROPOLITAN MLS RECORDS...</div>;

      return (
        <div className="space-y-8 max-w-5xl animate-fadeIn">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-2xl font-heading font-extrabold text-white">Properties & Portfolios</h1>
              <p className="text-xs text-zinc-500 font-heading">Manage active home listings, featured catalogs, and interactive calculator rates.</p>
            </div>
            <button onClick={handleSave} disabled={saving} className="bg-[#00b4d8] hover:bg-[#009cb8] font-bold text-xs tracking-wider uppercase px-6 py-3 rounded-xl text-zinc-950 text-center flex items-center justify-center gap-2 min-h-[44px]">
              {saving ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-cloud-arrow-up"></i>}
              <span>Save Portfolio Config</span>
            </button>
          </div>

          <div className="space-y-8">
            {/* PROPERTIES SECTION */}
            <div className="bg-zinc-900 border border-zinc-805 p-6 rounded-2xl">
              <div className="flex justify-between items-center border-b border-zinc-800 pb-4 mb-6">
                <h3 className="font-heading font-bold text-white text-md flex items-center gap-2">
                  <span className="w-1.5 h-6 bg-tealAccent inline-block rounded"></span>
                  Active Real Estate Listings
                </h3>
                <button onClick={() => setPropertyModal({ show: true, index: -1, payload: { id: '', title: '', price: 250000, bedrooms: 3, bathrooms: 2, area: 1800, imageUrl: '', description: '', featured: false } })} className="p-2 px-3.5 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-[10px] uppercase font-bold text-white tracking-widest flex items-center gap-2">
                  <i className="fa-solid fa-plus text-[#00b4d8]"></i> Add Property
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {(data?.properties || []).map((prop, idx) => (
                  <div key={prop.id || idx} className="bg-zinc-950 border border-zinc-805 rounded-xl overflow-hidden flex flex-col justify-between">
                    <div className="relative h-44 w-full bg-zinc-900 select-none">
                      {prop.imageUrl ? <img src={prop.imageUrl} className="w-full h-full object-cover" /> : <div className="text-xs text-zinc-800 h-full flex items-center justify-center"><i className="fa-solid fa-hotel text-2xl"></i></div>}
                      
                      <div className="absolute top-3 right-3 flex gap-2">
                        <button onClick={() => setPropertyModal({ show: true, index: idx, payload: prop })} className="p-1 px-2 bg-black/70 text-white rounded-md text-xs hover:bg-orangeAccent"><i className="fa-solid fa-pen"></i></button>
                        <button onClick={() => setDeleteModal({ show: true, index: idx })} className="p-1 px-2 bg-black/70 text-red-400 rounded-md text-xs hover:bg-red-600 hover:text-white"><i className="fa-solid fa-trash-can"></i></button>
                      </div>

                      {prop.featured && (
                        <span className="absolute bottom-3 left-3 bg-tealAccent text-zinc-950 text-[8px] font-mono font-extrabold uppercase px-2 py-0.5 rounded-md border border-tealAccent/20">Featured Unit</span>
                      )}
                    </div>

                    <div className="p-4 flex-1 flex flex-col justify-between">
                      <div className="mb-3">
                        <h4 className="font-heading font-extrabold text-[#00b4d8] text-sm m-0">${(prop.price || 0).toLocaleString()}</h4>
                        <h5 className="font-bold text-white text-xs mt-1 leading-tight">{prop.title}</h5>
                        <p className="text-zinc-500 text-[10px] uppercase font-mono mt-1 leading-none">{prop.area} SQFT • {prop.bedrooms} BEDS • {prop.bathrooms} BATHS</p>
                      </div>
                      <p className="text-zinc-400 text-xs leading-relaxed border-t border-[#111] pt-2.5 mt-2.5 truncate">{prop.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* MORTGAGESETTINGS */}
            <div className="bg-zinc-900 border border-[#222] p-6 rounded-2xl">
              <h3 className="font-heading font-bold text-white text-md border-b border-zinc-800 pb-3 mb-5 flex items-center gap-2">
                <span className="w-1.5 h-6 bg-zinc-400 inline-block rounded"></span>
                Calculator Settings
              </h3>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 text-xs">
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-zinc-500 uppercase tracking-widest font-bold">Standard Interest Rate (%)</label>
                      <input type="number" step="0.1" value={data?.mortgageSettings?.interestRate} onChange={e => setData({ ...data, mortgageSettings : { ...data.mortgageSettings, interestRate: Number(e.target.value) } })} className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-500 uppercase tracking-widest font-bold">Term Duration (Years)</label>
                      <input type="number" value={data?.mortgageSettings?.loanTermYears} onChange={e => setData({ ...data, mortgageSettings : { ...data.mortgageSettings, loanTermYears: Number(e.target.value) } })} className="w-full bg-zinc-950 border border-zinc-805 p-2.5 rounded-lg text-white" />
                    </div>
                  </div>
                  <div className="space-y-1">
                    <label className="text-zinc-500 uppercase tracking-widest font-bold font-bold">Incentives Help Text</label>
                    <textarea value={data?.mortgageSettings?.helpText} onChange={e => setData({ ...data, mortgageSettings : { ...data.mortgageSettings, helpText: e.target.value } })} rows={2} className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white leading-relaxed resize-none" />
                  </div>
                </div>

                <div className="bg-zinc-950/80 p-5 rounded-xl border border-zinc-800 flex flex-col justify-center items-center text-center text-zinc-500 space-y-1 font-mono text-xs">
                  <i className="fa-solid fa-calculator text-2xl text-tealAccent mb-2"></i>
                  <span>Calculated values use Standard Compound formulas:</span>
                  <p className="font-bold text-white">EMI = [P x R x (1+R)^N]/[((1+R)^N)-1]</p>
                  <span>Ensuring standard, offline matching calculations.</span>
                </div>
              </div>
            </div>

            {/* CALL TO ACTION */}
            <div className="bg-zinc-900 border border-zinc-805 p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="space-y-1">
                <label className="text-xs uppercase font-bold text-zinc-400">Real Estate Consulta Button Text</label>
                <input type="text" value={data?.cta?.buttonText} onChange={e => setData({ ...data, cta: { ...data.cta, buttonText: e.target.value } })} className="w-full bg-zinc-950 border border-zinc-800 p-3 rounded-xl text-white text-sm" />
              </div>
              <div className="space-y-1">
                <label className="text-xs uppercase font-bold text-zinc-400">Target Segment URL Route</label>
                <input type="text" value={data?.cta?.buttonLink} onChange={e => setData({ ...data, cta: { ...data.cta, buttonLink: e.target.value } })} className="w-full bg-zinc-950 border border-zinc-800 p-3 rounded-xl text-white text-sm font-mono" />
              </div>
            </div>
          </div>

          {/* EDIT PROPERTIES MODAL */}
          {propertyModal.show && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scroll">
                <h4 className="font-heading font-bold text-white text-lg">{propertyModal.index === -1 ? 'Add Property Listing' : 'Edit Listing Details'}</h4>
                <form onSubmit={savePropertyItem} className="space-y-4 text-xs">
                  <div className="space-y-1">
                    <label className="text-zinc-500 uppercase tracking-widest font-bold">Property Caption Name</label>
                    <input type="text" value={propertyModal.payload.title} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, title: e.target.value } })} required className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-zinc-500 uppercase tracking-widest font-bold">MLS Price ($ USD)</label>
                      <input type="number" value={propertyModal.payload.price} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, price: e.target.value } })} required className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-500 uppercase tracking-widest font-bold">Zoning Area Size (Sqft)</label>
                      <input type="number" value={propertyModal.payload.area} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, area: e.target.value } })} required className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-zinc-500 uppercase tracking-widest font-bold">Bedrooms Count</label>
                      <input type="number" value={propertyModal.payload.bedrooms} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, bedrooms: e.target.value } })} required className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-zinc-500 uppercase tracking-widest font-bold">Bathrooms Count</label>
                      <input type="number" value={propertyModal.payload.bathrooms} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, bathrooms: e.target.value } })} required className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white" />
                    </div>
                  </div>
                  <div className="space-y-1">
                    <label className="text-zinc-500 uppercase tracking-widest font-bold">Bullet attributes & Description Details</label>
                    <textarea value={propertyModal.payload.description || ""} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, description: e.target.value } })} rows={3} required className="w-full bg-zinc-950 border border-zinc-800 p-2.5 rounded-lg text-white leading-relaxed resize-none" />
                  </div>
                  <div className="flex items-center gap-2 py-1 select-none">
                    <input type="checkbox" id="featured" checked={propertyModal.payload.featured || false} onChange={e => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, featured: e.target.checked } })} className="accent-tealAccent rounded border-zinc-800 bg-zinc-950 w-4 h-4 cursor-pointer" />
                    <label htmlFor="featured" className="text-zinc-400 font-semibold cursor-pointer">Mark as Featured Showcase Portfolios</label>
                  </div>
                  <CloudinaryUpload 
                    currentUrl={propertyModal.payload.imageUrl} 
                    onUploadComplete={(url) => setPropertyModal({ ...propertyModal, payload: { ...propertyModal.payload, imageUrl: url } })} 
                    label="Property Facade Image" 
                  />
                  <div className="flex justify-end gap-3 pt-2">
                    <button type="button" onClick={() => setPropertyModal({ show: false, index: -1, payload: {} })} className="px-4 py-2 bg-zinc-800 text-white font-bold rounded-lg hover:bg-zinc-700">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-[#00b4d8] text-zinc-950 font-extrabold rounded-lg hover:bg-[#009cb8]">Save Item</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CONFIRM DELETE MODAL */}
          {deleteModal.show && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-red-950/40 text-red-400 mx-auto flex items-center justify-center text-lg">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h4 className="font-heading font-bold text-white text-md m-0">Confirm deletion</h4>
                <p className="text-xs text-zinc-500 leading-relaxed">This acts as a definitive list removal. Confirm deletion to apply database updates?</p>
                <div className="flex justify-center gap-3 pt-2">
                  <button onClick={() => setDeleteModal({ show: false, index: -1 })} className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-lg text-xs">Keep Listing</button>
                  <button onClick={confirmDelete} className="px-5 py-2 bg-red-650 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-lg text-xs">Confirm Delete</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- SUB-VIEW: COMPREHENSIVE ACTIVITY/AUDIT SECURITY LOGS ---
    function ActivityLogsView() {
      const { fbDB, firebaseReady, addToast } = useContext(AppContext);
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [clearing, setClearing] = useState(false);
      const [confirmClear, setConfirmClear] = useState(false);

      const fetchLogs = useCallback(async () => {
        if (!firebaseReady || !fbDB) return;
        setLoading(true);
        try {
          const snap = await fbDB.collection('adminLogs').orderBy('timestamp', 'desc').limit(20).get();
          const list = [];
          snap.forEach(doc => {
            list.push({ id: doc.id, ...doc.data() });
          });
          setLogs(list);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      }, [firebaseReady, fbDB]);

      useEffect(() => {
        fetchLogs();
      }, [fetchLogs]);

      const handleClearLogs = async () => {
        setClearing(true);
        try {
          const snap = await fbDB.collection('adminLogs').get();
          const batch = fbDB.batch();
          snap.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
          addToast("Activity security audit trails cleared.", "success");
          setLogs([]);
          setConfirmClear(false);
        } catch (e) {
          addToast("Failed to clean server logs.", "error");
        } finally {
          setClearing(false);
        }
      };

      if (loading) return <div className="text-zinc-500 animate-pulse font-mono flex items-center justify-center p-20 py-40 gap-3"><i className="fa-solid fa-spinner animate-spin"></i>FETCHING AUDIT LOGS...</div>;

      return (
        <div className="space-y-8 max-w-4xl animate-fadeIn">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-2xl font-heading font-extrabold text-white">Security & Audit Logs</h1>
              <p className="text-xs text-zinc-500 font-heading">Complete tracking index of administrative actions and timestamps.</p>
            </div>
            
            {logs.length > 0 && (
              <button onClick={() => setConfirmClear(true)} className="px-4 py-2 bg-zinc-900 border border-zinc-800 text-xs font-bold text-zinc-400 hover:text-red-400 hover:border-red-900/30 rounded-lg flex items-center gap-2 transition-colors min-h-[44px]">
                <i className="fa-solid fa-trash-can"></i>
                <span>Purge security logs</span>
              </button>
            )}
          </div>

          <div className="bg-zinc-900 border border-zinc-805 rounded-2xl overflow-hidden shadow-2xl">
            {logs.length === 0 ? (
              <div className="p-12 text-center text-zinc-650 space-y-1.5 flex flex-col items-center">
                <i className="fa-solid fa-list text-2xl text-zinc-700/60 mb-2"></i>
                <p className="text-sm font-semibold text-zinc-500">No events logged yet.</p>
                <span className="text-[10px] text-zinc-650 uppercase font-mono">Operations will register automatically on save procedures.</span>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-zinc-950 text-zinc-500 uppercase tracking-wider border-b border-zinc-800">
                      <th className="p-4 py-3 font-bold font-mono">Date & Time</th>
                      <th className="p-4 py-3 font-bold">Action Event Metric</th>
                      <th className="p-4 py-3 font-bold font-mono">Agent Account</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#181818] text-zinc-350">
                    {logs.map(lg => {
                      const dateStr = lg.timestamp ? new Date(lg.timestamp.seconds * 1000).toLocaleString() : 'Now saving on server';
                      return (
                        <tr key={lg.id} className="hover:bg-zinc-950/40 transition-colors">
                          <td className="p-4 py-3.5 font-mono text-zinc-450 whitespace-nowrap">{dateStr}</td>
                          <td className="p-4 py-3.5 font-semibold text-white">{lg.action}</td>
                          <td className="p-4 py-3.5 font-mono text-zinc-400">{lg.adminEmail}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* CONFIRM PURGE DIALOG */}
          {confirmClear && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-red-950/40 text-red-400 mx-auto flex items-center justify-center text-lg">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h4 className="font-heading font-bold text-white text-md">Purge complete security audit log history?</h4>
                <p className="text-xs text-zinc-500 leading-relaxed">This will physically purge all administrative track recordings completely. Action is irreversible.</p>
                <div className="flex justify-center gap-3 pt-2">
                  <button onClick={() => setConfirmClear(false)} className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-lg text-xs">Keep Logs</button>
                  <button onClick={handleClearLogs} disabled={clearing} className="px-5 py-2 bg-red-650 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-lg text-xs">
                    {clearing ? <i className="fa-solid fa-spinner animate-spin mr-1"></i> : null}
                    Confirm Purge
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App entrypoint
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
